<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--ააგეთ რეგისტრაციის ფორმა(მინიმუმ უნდა ქონდეს: სახელი, გვარი, ელფოსტა, ასაკი, პაროლი)-->
    <label for="name">სახელი</label>
    <input type="text" id="name">
    <br>
    <label for="surname">გვარი</label>
    <input type="text" id="surname">
    <br>
    <label for="age">ასაკი</label>
    <input type="number" id="age">
    <br>
    <label for="e-mail">ელ-ფოსტა</label>
    <input type="email" id="e-mail">
    <br>
    <label for="password">პაროლი</label>
    <input type="password" id="password">
    <br>
    <label for="birth date">დაბადების თარიღი</label>
    <input type="date" id="birth date">
    <input type="submit" value="რეგისტრაცია">   
</body>
</html>
