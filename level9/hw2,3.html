<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
 <!-- 2) ახსენით რა დანიშნულება აქვს label ტეგს 
  3) როგორ უნდა დავაკავშიროთ input და label ტეგები ერთმანეთთან -->

<p>
label თეგი გამოიყენება იმისთვის რომ მომხმარებელმა ზუსტად იცოდეს რა ტიპის ინფორმაცია უნდა შეიყვანოს შესაბამის ველში. <br>
label და input ელემენტები ერთმანეთს უკავშირდებიან for ატრიბუტის მეშვეობით რომელიც უნდა ემთხვეოდეს 
input ელემენტის id-ს.
</p>
<h4>მაგალითად:</h4>

<label for="email">ელფოსტა:</label>
<input type="email" id="email">

</body>
</html>
