<body>
  <!--2) ახსენით რა დანიშნულება აქვს label ტეგს
  3) როგორ უნდა დავაკავშიროთ input და label ტეგები ერთმანეთთან-->
  <p> label თეგი გამოიყენება იმისთვის რომ მომხმარებელი მიხვდეს რა ინფორმაცია შეიყვანოს 
   input ველებში.for ატრიბუტს ვუკავშირებთ input ელემენტს იგივე id-ს საშუალებით
  </p>
  <h4>მაგალითად:</h4>
  <label for="email">ელფოსტა:</label>
  <input type="email" id="email">  
</body>
