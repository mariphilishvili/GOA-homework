<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registration form</h1>
    <form>
        <label for="Name">First name: </label>
        <input type="text" id="Name" name="first name">
        <br>
        <br>
        <label for="lastname">Last Name: </label>
        <input type="text" id="lastname" name="last name">
        <br>
        <br>
        <label for="Email">E-mail: </label>
        <input type="email" id="Email" name="last name">
        <br>
        <br>
        <label for="password">Password: </label>
        <input type="password" id="password" name="password">
        <br>
        <br>
        <label for="gender">Gender: </label>
        <br>
        <label for="male">Male</label>
        <input type="radio" id="male" name="male">
        <br>
        <label for="female">Female</label>
        <input type="radio" id="female" name="female">
        <br>
        <label for="other">Other</label>
        <input type="radio" id="other" name="other">
        <br>
        <br>
        <label for="age">Age: </label>
        <input type="number" id="age" name="age">
        <br>
        <br>
        <label for="preferences">Preferences: </label>
        <br>
        <label for="blue">Blue</label>
        <input type="checkbox" id="blue" name="preferences" value="blue">
        <br>
        <label for="red">Red</label>
        <input type="checkbox" id="red" name="prenferences" value="red">
        <br>
        <br>
        <input type="submit" value="Register">

    </form>
</body>
</html>
